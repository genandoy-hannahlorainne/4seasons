services:
  backend:
    build:
      context: ./backend-laravel
      dockerfile: Dockerfile
    ports:
      - "8082:80"
    env_file:
      - ./backend-laravel/.env.docker
    environment:
      - APP_ENV=local
      - APP_KEY=base64:F7xSMYbmECxKhU/++3Xkc2eCu73jBsMXGRgFs7SYeBI=
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "10", "http://localhost/api/health"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 90s
    volumes:
      - ./backend-laravel:/var/www/html
      - backend_vendor:/var/www/html/vendor
    command: >
      sh -c "chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache &&
             chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache &&
             php artisan config:clear &&
             php artisan migrate --force &&
             php artisan db:seed --force --class=RoleSeeder || true &&
             php artisan db:seed --force --class=AdminSeeder || true &&
             php artisan db:seed --force --class=SectionSeeder || true &&
             php artisan db:seed --force --class=DevSeeder || true &&
             apache2-foreground"

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: 4seasons
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  mysql-test:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: 4seasons_test
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    volumes:
      - mysql_test_data:/var/lib/mysql
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: secret
      PMA_ARBITRARY: 1
    depends_on:
      - mysql
    networks:
      - app-network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - app-network

volumes:
  mysql_data:
  mysql_test_data:
  redis_data:
  backend_vendor:

networks:
  app-network:
    driver: bridge
server {
    listen 80;
    server_name api.studentcare.site;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.studentcare.site;

    # SSL Configuration
    ssl_certificate /etc/ssl/cloudflare/api.studentcare.site.pem;
    ssl_certificate_key /etc/ssl/cloudflare/api.studentcare.site.key;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Logging
    access_log /var/log/nginx/api.studentcare.site.access.log;
    error_log /var/log/nginx/api.studentcare.site.error.log;

    # Security headers 
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Serve static frontend build files if a request targets an asset
    root /usr/share/nginx/html;

    # Static assets: serve from frontend build directory if present
    location ~* \.(js|css|map|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # PWA files
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Service-Worker-Allowed "/";
        add_header Content-Type "application/javascript";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Type "application/manifest+json";
        try_files $uri =404;
    }

    # Proxy only API routes to the backend (prevents frontend asset requests being proxied)
    location ^~ /api/ {
        # CORS is handled entirely by Laravel's CORS middleware.
        # Do NOT add Access-Control-* headers here — nginx + Laravel both setting
        # them causes duplicate header values which browsers reject.

        # Handle preflight — pass it through to Laravel so it can respond correctly
        if ($request_method = 'OPTIONS') {
            proxy_pass http://backend:80;
        }

        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_request_headers on;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Ensure sanctum csrf endpoint is proxied as well
    location = /sanctum/csrf-cookie {
        # CORS handled by Laravel — no headers added here

        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_request_headers on;
    }

    # Anything else should not be proxied to backend to avoid serving HTML for JS
    location / {
        return 404;
    }
}

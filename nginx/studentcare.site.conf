server {
    listen 80;
    server_name studentcare.site www.studentcare.site;
    return 301 https://studentcare.site$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.studentcare.site;

    ssl_certificate /etc/ssl/cloudflare/api.studentcare.site.pem;
    ssl_certificate_key /etc/ssl/cloudflare/api.studentcare.site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    return 301 https://studentcare.site$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name studentcare.site;

    ssl_certificate /etc/ssl/cloudflare/api.studentcare.site.pem;
    ssl_certificate_key /etc/ssl/cloudflare/api.studentcare.site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/studentcare.site.access.log;
    error_log /var/log/nginx/studentcare.site.error.log;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    root /usr/share/nginx/html;
    index index.html;

    # Angular — serve index.html for all routes (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker — must NEVER be cached and needs correct headers
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Service-Worker-Allowed "/";
        add_header Content-Type "application/javascript";
        try_files $uri =404;
    }

    # PWA manifest — no cache so updates are picked up immediately
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Type "application/manifest+json";
        try_files $uri =404;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

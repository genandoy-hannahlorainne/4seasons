name: Staging Deploy + Smoke Tests

on:
  workflow_dispatch:

jobs:
  deploy-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Copy frontend bundle to staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "frontend/dist/frontend/browser/**"
          target: "/srv/4seasons/frontend-dist"
          timeout: 60s

      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            cd /srv/4seasons

            # Backwards-compatible env handling:
            # prefer .env.prod, but fall back to an existing .env on older servers.
            if [ ! -f .env.prod ] && [ -f .env ]; then
              cp .env .env.prod
            fi
            if [ ! -f .env.prod ]; then
              echo "Missing .env.prod (or legacy .env) on the deploy host"
              exit 1
            fi

            # pull latest images and restart
            docker-compose pull
            docker-compose up -d --remove-orphans
            # run migrations
            docker-compose exec -T backend php artisan migrate --force

      - name: Run smoke tests against staging
        env:
          SMOKE_USER: ${{ secrets.SMOKE_USER }}
          SMOKE_PASS: ${{ secrets.SMOKE_PASS }}
        run: |
          set -e
          echo "Request CSRF cookie"
          curl -c cookies.txt -i https://api.staging.studentcare.site/sanctum/csrf-cookie

          echo "Login with smoke account"
          curl -b cookies.txt -c cookies.txt -X POST https://api.staging.studentcare.site/api/login \
            -d "username=${SMOKE_USER}&password=${SMOKE_PASS}" -H "Content-Type: application/x-www-form-urlencoded" -i

          echo "Verify /me"
          curl -b cookies.txt -X GET https://api.staging.studentcare.site/api/me -i


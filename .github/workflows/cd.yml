name: CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: docker.io

concurrency:
  group: 4seasons-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push backend image
      uses: docker/build-push-action@v6
      with:
        context: ./backend-laravel
        file: ./backend-laravel/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/4seasons-backend:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/4seasons-backend:${{ github.sha }}
        no-cache: true

    - name: Copy nginx configs to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "nginx/*.conf,docker-compose.prod.yml"
        target: "${{ secrets.SERVER_DEPLOY_PATH }}"
        timeout: 60s
        debug: true

    - name: Deploy on server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        timeout: 60s
        command_timeout: 10m
        debug: true
        script_stop: true
        script: |
          set -e
          cd "${{ secrets.SERVER_DEPLOY_PATH }}"

          mkdir -p nginx
          if [ -f api.studentcare.site.conf ]; then
            mv api.studentcare.site.conf nginx/
          fi
          if [ -f studentcare.site.conf ]; then
            mv studentcare.site.conf nginx/
          fi
          mv docker-compose.prod.yml docker-compose.yml || true

          if docker compose version >/dev/null 2>&1; then
            COMPOSE_CMD="docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then
            COMPOSE_CMD="docker-compose"
          else
            echo "Neither docker compose nor docker-compose is installed on server"
            exit 1
          fi

          $COMPOSE_CMD pull || {
            echo "Pull failed, retrying after 15s..."
            sleep 15
            $COMPOSE_CMD pull
          }
          $COMPOSE_CMD up -d --force-recreate

          BACKEND_CONTAINER="$($COMPOSE_CMD ps -q backend)"
          if [ -n "$BACKEND_CONTAINER" ]; then
            echo "Waiting for backend to become healthy..."
            for i in $(seq 1 24); do
              STATUS="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$BACKEND_CONTAINER")"
              if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "running" ]; then
                echo "Backend status: $STATUS"
                break
              fi
              if [ "$i" -eq 24 ]; then
                echo "Backend did not become healthy in time (last status: $STATUS)"
                docker logs --tail 100 "$BACKEND_CONTAINER" || true
                exit 1
              fi
              echo "Current backend status: $STATUS (attempt $i/24)"
              sleep 5
            done
          fi

          # Clear and rebuild config cache
          BACKEND_CONTAINER="$($COMPOSE_CMD ps -q backend)"
          docker exec "$BACKEND_CONTAINER" php artisan config:clear
          docker exec "$BACKEND_CONTAINER" php artisan config:cache

          docker image prune -f

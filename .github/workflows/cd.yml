name: CD Pipeline

on:
  pull_request:
    branches: [ main ]
    types: [ closed ]
  workflow_dispatch:

concurrency:
  group: 4seasons-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push backend image
      uses: docker/build-push-action@v6
      with:
        context: ./backend-laravel
        file: ./backend-laravel/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/4seasons-backend:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/4seasons-backend:${{ github.sha }}
        cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/4seasons-backend:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/4seasons-backend:buildcache,mode=max

    - name: Copy nginx configs to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "nginx/*.conf,docker-compose.yml"
        target: "${{ secrets.SERVER_DEPLOY_PATH }}"

    - name: Deploy on server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script_stop: true
        script: |
          set -e
          cd "${{ secrets.SERVER_DEPLOY_PATH }}"

          if docker compose version >/dev/null 2>&1; then
            COMPOSE_CMD="docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then
            COMPOSE_CMD="docker-compose"
          else
            echo "Neither docker compose nor docker-compose is installed on server"
            exit 1
          fi

          $COMPOSE_CMD pull
          $COMPOSE_CMD up -d

          BACKEND_CONTAINER="$($COMPOSE_CMD ps -q backend)"
          if [ -n "$BACKEND_CONTAINER" ]; then
            echo "Waiting for backend to become healthy..."
            for i in $(seq 1 24); do
              STATUS="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$BACKEND_CONTAINER")"
              if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "running" ]; then
                echo "Backend status: $STATUS"
                break
              fi
              if [ "$i" -eq 24 ]; then
                echo "Backend did not become healthy in time (last status: $STATUS)"
                docker logs --tail 100 "$BACKEND_CONTAINER" || true
                exit 1
              fi
              echo "Current backend status: $STATUS (attempt $i/24)"
              sleep 5
            done
          fi

          docker image prune -f

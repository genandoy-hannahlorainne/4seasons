name: CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: 4seasons-backend

concurrency:
  group: 4seasons-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-laravel
          file: ./backend-laravel/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy nginx configs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "nginx/*.conf,docker-compose.prod.yml"
          target: "${{ secrets.SERVER_DEPLOY_PATH }}"
          timeout: 60s

      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 10m
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.SERVER_DEPLOY_PATH }}"

            mkdir -p nginx
            if [ -f api.studentcare.site.conf ]; then
              mv api.studentcare.site.conf nginx/
            fi
            if [ -f studentcare.site.conf ]; then
              mv studentcare.site.conf nginx/
            fi
            mv docker-compose.prod.yml docker-compose.yml || true

            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              echo "Neither docker compose nor docker-compose is installed on server"
              exit 1
            fi

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            docker tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:latest

            $COMPOSE_CMD up -d --force-recreate

            BACKEND_CONTAINER="$($COMPOSE_CMD ps -q backend)"
            if [ -n "$BACKEND_CONTAINER" ]; then
              echo "Waiting for backend to become healthy..."
              for i in $(seq 1 24); do
                STATUS="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$BACKEND_CONTAINER")"
                if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "running" ]; then
                  echo "Backend status: $STATUS"
                  break
                fi
                if [ "$i" -eq 24 ]; then
                  echo "Backend did not become healthy in time (last status: $STATUS)"
                  docker logs --tail 100 "$BACKEND_CONTAINER" || true
                  exit 1
                fi
                echo "Current backend status: $STATUS (attempt $i/24)"
                sleep 5
              done
            fi

            BACKEND_CONTAINER="$($COMPOSE_CMD ps -q backend)"
            docker exec "$BACKEND_CONTAINER" php artisan config:clear
            docker exec "$BACKEND_CONTAINER" php artisan migrate --force
            # Do not config:cache — breaks FCM JSON from Docker env; use config:clear only
            docker image prune -f

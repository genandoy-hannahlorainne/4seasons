name: CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: docker.io

concurrency:
  group: 4seasons-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build

    - name: Deploy frontend to Cloudflare Pages
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: pages deploy dist/frontend/browser --project-name=4seasons --branch=main

    - name: Build and push backend image
      uses: docker/build-push-action@v6
      with:
        context: ./backend-laravel
        file: ./backend-laravel/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/4seasons-backend:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/4seasons-backend:${{ github.sha }}
        cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/4seasons-backend:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/4seasons-backend:buildcache,mode=max

    - name: Copy nginx configs to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "nginx/*.conf,docker-compose.prod.yml"
        target: "${{ secrets.SERVER_DEPLOY_PATH }}"
        timeout: 60s
        debug: true

    - name: Deploy on server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        timeout: 60s
        command_timeout: 10m
        debug: true
        script_stop: true
        script: |
          set -e
          cd "${{ secrets.SERVER_DEPLOY_PATH }}"

          mkdir -p nginx
          if [ -f api.studentcare.site.conf ]; then
            mv api.studentcare.site.conf nginx/
          fi
          if [ -f studentcare.site.conf ]; then
            mv studentcare.site.conf nginx/
          fi
          mv docker-compose.prod.yml docker-compose.yml || true

          if docker compose version >/dev/null 2>&1; then
            COMPOSE_CMD="docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then
            COMPOSE_CMD="docker-compose"
          else
            echo "Neither docker compose nor docker-compose is installed on server"
            exit 1
          fi

          # Force IPv4-only on Docker daemon to fix registry pull failures over IPv6
          DAEMON_JSON=/etc/docker/daemon.json
          echo "Applying Docker daemon IPv4-only config..."
          echo '{"ipv6": false, "ip6tables": false}' | sudo tee "$DAEMON_JSON" > /dev/null
          sudo systemctl restart docker
          # Wait until Docker is fully back up
          timeout 30 bash -c 'until sudo docker info > /dev/null 2>&1; do sleep 2; done'
          echo "Docker daemon restarted successfully"

          # Also block IPv6 at the OS level for docker registry connections
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 || true
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1 || true

          $COMPOSE_CMD pull || {
            echo "Pull failed, retrying after 15s..."
            sleep 15
            $COMPOSE_CMD pull
          }
          $COMPOSE_CMD up -d

          BACKEND_CONTAINER="$($COMPOSE_CMD ps -q backend)"
          if [ -n "$BACKEND_CONTAINER" ]; then
            echo "Waiting for backend to become healthy..."
            for i in $(seq 1 24); do
              STATUS="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$BACKEND_CONTAINER")"
              if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "running" ]; then
                echo "Backend status: $STATUS"
                break
              fi
              if [ "$i" -eq 24 ]; then
                echo "Backend did not become healthy in time (last status: $STATUS)"
                docker logs --tail 100 "$BACKEND_CONTAINER" || true
                exit 1
              fi
              echo "Current backend status: $STATUS (attempt $i/24)"
              sleep 5
            done
          fi

          docker image prune -f

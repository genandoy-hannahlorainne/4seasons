<div class="role-selection-container">
  <div class="hero-section">
    <div class="overlay"></div>
    <div class="content">
      <h1 class="title">PDMHS Student Medical System</h1>
      <p class="subtitle">Sign in to start your session</p>
    </div>
  </div>
  
  <div class="button-group">
    <button class="btn btn-role" (click)="selectRole('student')">Student</button>
    <button class="btn btn-role" (click)="selectRole('adviser')">Adviser</button>
    <button class="btn btn-role" (click)="selectRole('clinic-staff')">Clinic Staff</button>
    <button class="btn btn-role" (click)="selectRole('admin')">Admin</button>
  </div>
</div>

version: '3.8'

services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/api.studentcare.site.conf:/etc/nginx/conf.d/default.conf
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  backend:
    image: notcla/4seasons-backend:latest
    expose:
      - "80"
    env_file:
      - ./backend-laravel/.env.prod
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "10", "http://localhost/api/health"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - app-network

volumes:
  redis_data:

networks:
  app-network:
    driver: bridge
